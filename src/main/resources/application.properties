spring.application.name=soa-containerization
server.port=8081
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/soa_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:soa_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:soa_password}
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.open-in-view=false
